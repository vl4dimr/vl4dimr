name: Entre Campus · CI

on:
  pull_request:
    paths: ["entre-campus/**", ".github/workflows/entre-campus-*.yml"]
  push:
    branches: [main]
    paths: ["entre-campus/**", ".github/workflows/entre-campus-*.yml"]

permissions:
  contents: read

concurrency:
  group: entre-campus-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: entre-campus

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: entre-campus/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Validación Zod de los datos
        run: npm run validar
      - name: Pruebas unitarias
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas e2e y axe
        run: npm run e2e -- --trace off
      - name: Lighthouse CI (≥ 90 en todas las categorías)
        run: npx --yes @lhci/cli@0.16.x autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: entre-campus/playwright-report
          retention-days: 7
